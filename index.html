<title>Editor de Vídeo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f4f9;--surface:#fff;--surface2:#f0eef8;--border:#e2dff0;
  --fg:#1a1830;--fg2:#5a5680;--accent:#5b3fe4;--accent2:#7c63f0;
  --accent-bg:#ede9fd;--success:#16a34a;--success-bg:#dcfce7;
  --error:#dc2626;--error-bg:#fee2e2;--warn:#d97706;--warn-bg:#fef3c7;
  --shadow:0 2px 12px rgba(91,63,228,.10);--radius:16px;color-scheme:light;
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f0d1a;--surface:#1a1830;--surface2:#231f38;--border:#2e2a48;
    --fg:#f0eeff;--fg2:#a099cc;--accent:#7c63f0;--accent2:#9b87f5;
    --accent-bg:#1e1840;--success-bg:#052e16;--error-bg:#450a0a;--warn-bg:#422006;
    --shadow:0 2px 12px rgba(0,0,0,.4);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f0d1a;--surface:#1a1830;--surface2:#231f38;--border:#2e2a48;
  --fg:#f0eeff;--fg2:#a099cc;--accent:#7c63f0;--accent2:#9b87f5;
  --accent-bg:#1e1840;--success-bg:#052e16;--error-bg:#450a0a;--warn-bg:#422006;
  --shadow:0 2px 12px rgba(0,0,0,.4);color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Nunito',sans-serif;background:var(--bg);color:var(--fg);
  font-size:18px;line-height:1.5;min-height:100vh;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0;
}
.header{
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:14px max(16px,env(safe-area-inset-left,0px));
  padding-top:max(14px,env(safe-area-inset-top,0px));
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100;box-shadow:var(--shadow);
}
.logo{display:flex;align-items:center;gap:10px;}
.logo-icon{font-size:26px;}
.logo-text{font-size:20px;font-weight:800;color:var(--accent);}
.btn-theme{
  background:var(--surface2);border:1px solid var(--border);border-radius:50%;
  width:44px;height:44px;font-size:20px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;color:var(--fg);
}
.main{max-width:760px;margin:0 auto;padding:20px 0 80px;}
.card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:20px;margin-bottom:16px;
  box-shadow:var(--shadow);
}
.card-title{font-size:19px;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
/* UPLOAD */
.upload-zone{
  border:3px dashed var(--accent);border-radius:var(--radius);
  background:var(--accent-bg);padding:32px 16px;text-align:center;
  cursor:pointer;position:relative;transition:opacity .2s;
}
.upload-zone:hover{opacity:.85;}
.upload-zone input{position:absolute;inset:0;opacity:0;cursor:pointer;}
.upload-icon{font-size:48px;margin-bottom:8px;}
.upload-text{font-size:20px;font-weight:700;color:var(--accent);}
.upload-sub{font-size:15px;color:var(--fg2);margin-top:4px;}
/* CLIPS LIST */
.clips-list{display:flex;flex-direction:column;gap:12px;}
.clip-card{
  background:var(--surface2);border:2px solid var(--border);
  border-radius:14px;overflow:hidden;
}
.clip-card.editing{border-color:var(--accent);}
.clip-header{
  display:flex;align-items:center;gap:10px;padding:14px 14px 14px;
  cursor:pointer;
}
.clip-num{
  background:var(--accent);color:#fff;font-weight:800;font-size:15px;
  width:32px;height:32px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;flex-shrink:0;
}
.clip-info{flex:1;min-width:0;}
.clip-name{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.clip-meta{font-size:13px;color:var(--fg2);margin-top:2px;}
.clip-actions{display:flex;gap:6px;flex-shrink:0;}
.btn-icon{
  background:var(--surface);border:1px solid var(--border);
  border-radius:10px;width:40px;height:40px;font-size:18px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  color:var(--fg);transition:background .15s;
}
.btn-icon:hover{background:var(--accent-bg);}
.btn-icon.danger:hover{background:var(--error-bg);color:var(--error);}
.btn-icon:disabled{opacity:.35;cursor:not-allowed;}
/* EDITOR INLINE */
.clip-editor{padding:0 14px 14px;}
.video-wrap{background:#000;border-radius:10px;overflow:hidden;margin-bottom:12px;}
video{width:100%;display:block;max-height:280px;object-fit:contain;}
.play-row{display:flex;gap:8px;justify-content:center;margin-bottom:12px;flex-wrap:wrap;}
/* TIMELINE */
.timeline-wrap{background:var(--surface);border-radius:12px;padding:14px;margin-bottom:12px;}
.tl-hint{font-size:13px;color:var(--fg2);font-weight:600;margin-bottom:8px;}
.tl-bar{
  position:relative;height:48px;background:var(--border);
  border-radius:8px;overflow:visible;margin-bottom:10px;cursor:pointer;
}
.tl-selected{position:absolute;top:0;bottom:0;background:var(--accent);opacity:.4;pointer-events:none;}
.tl-playhead{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--accent2);border-radius:4px;pointer-events:none;}
.tl-handle{
  position:absolute;top:50%;transform:translateY(-50%);
  width:20px;height:40px;border-radius:6px;cursor:ew-resize;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;color:#fff;font-weight:800;z-index:2;
  touch-action:none;box-shadow:0 2px 6px rgba(0,0,0,.3);
}
.tl-in{background:#16a34a;margin-left:-10px;}
.tl-out{background:#dc2626;margin-left:-10px;}
.time-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.time-box{background:var(--bg);border:2px solid var(--border);border-radius:10px;padding:10px 14px;}
.time-box-lbl{font-size:12px;font-weight:700;color:var(--fg2);text-transform:uppercase;letter-spacing:.04em;}
.time-box-val{font-size:22px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums;}
.mark-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
/* BUTTONS */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  border:none;border-radius:12px;font-family:'Nunito',sans-serif;
  font-size:17px;font-weight:700;cursor:pointer;padding:12px 18px;
  min-height:52px;transition:opacity .15s,transform .1s;white-space:nowrap;
}
.btn:active{transform:scale(.97);opacity:.85;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-secondary{background:var(--surface2);color:var(--fg);border:2px solid var(--border);}
.btn-success{background:var(--success);color:#fff;}
.btn-danger{background:var(--error);color:#fff;}
.btn-green{background:#16a34a;color:#fff;}
.btn-red{background:#dc2626;color:#fff;}
.btn-full{width:100%;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn-lg{font-size:20px;min-height:64px;padding:16px 24px;border-radius:14px;}
/* EMPTY */
.empty{text-align:center;padding:36px 16px;color:var(--fg2);}
.empty-icon{font-size:48px;margin-bottom:10px;}
/* ALERT */
.alert{border-radius:10px;padding:12px 14px;font-size:15px;font-weight:600;display:flex;align-items:flex-start;gap:8px;margin-bottom:12px;}
.alert-icon{font-size:18px;flex-shrink:0;}
.alert-success{background:var(--success-bg);color:var(--success);}
.alert-error{background:var(--error-bg);color:var(--error);}
.alert-info{background:var(--accent-bg);color:var(--accent);}
/* PROGRESS */
.prog-wrap{margin:12px 0;}
.prog-lbl{font-size:15px;font-weight:700;color:var(--fg2);margin-bottom:6px;text-align:center;}
.prog-bg{height:18px;background:var(--surface2);border-radius:20px;overflow:hidden;border:1px solid var(--border);}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:20px;transition:width .3s;}
/* FIELD */
.field{margin-bottom:14px;}
.field label{display:block;font-size:15px;font-weight:700;color:var(--fg2);margin-bottom:5px;}
.field input{
  width:100%;background:var(--surface2);border:2px solid var(--border);
  border-radius:10px;padding:12px 14px;font-family:'Nunito',sans-serif;
  font-size:17px;color:var(--fg);outline:none;
}
.field input:focus{border-color:var(--accent);}
/* SEQUENCE BADGE */
.seq-badge{
  display:inline-flex;align-items:center;gap:4px;
  background:var(--accent-bg);color:var(--accent);
  font-size:13px;font-weight:700;padding:3px 10px;border-radius:20px;
}
.hidden{display:none!important;}
/* DOWNLOAD */
.download-btn{
  display:flex;align-items:center;justify-content:center;gap:10px;
  background:var(--success);color:#fff;border-radius:14px;
  font-size:20px;font-weight:800;padding:18px;text-decoration:none;
  min-height:64px;transition:opacity .15s;cursor:pointer;border:none;
  font-family:'Nunito',sans-serif;width:100%;
}
.download-btn:active{opacity:.85;}
</style>

<!-- HEADER -->
<div class="header">
  <div class="logo">
    <span class="logo-icon">✂️</span>
    <span class="logo-text">Editor de Vídeo</span>
  </div>
  <button class="btn-theme" id="themeBtn">🌙</button>
</div>

<div class="main">

  <!-- CLIPS -->
  <div class="card" id="clipsCard">
    <div class="card-title">🎬 Clipes
      <span id="clipsCount" class="seq-badge hidden">0 clipes</span>
    </div>
    <div id="clipsList" class="clips-list">
      <div class="empty" id="emptyMsg">
        <div class="empty-icon">🎞️</div>
        Nenhum vídeo adicionado.<br>Adicione abaixo!
      </div>
    </div>
  </div>

  <!-- ADD VIDEO -->
  <div class="card">
    <div class="card-title">➕ Adicionar Vídeo</div>
    <div class="upload-zone">
      <input type="file" accept="video/*" id="fileInput" multiple>
      <div class="upload-icon">📂</div>
      <div class="upload-text">Toque para escolher vídeo(s)</div>
      <div class="upload-sub">Pode selecionar vários de uma vez</div>
    </div>
  </div>

  <!-- EXPORTAR -->
  <div class="card" id="exportCard">
    <div class="card-title">⬇️ Exportar</div>
    <div id="exportAlert" class="hidden"></div>
    <div id="exportProgress" class="hidden">
      <div class="prog-wrap">
        <div class="prog-lbl" id="exportLabel">Processando...</div>
        <div class="prog-bg"><div class="prog-fill" id="exportFill" style="width:0%"></div></div>
      </div>
    </div>
    <button class="btn btn-primary btn-full btn-lg" id="btnExport">✂️ Exportar Todos os Clipes</button>
    <div id="downloadSection" class="hidden" style="margin-top:14px;">
      <button class="download-btn" id="btnDownload">⬇️ Baixar Vídeo Final</button>
      <p style="text-align:center;margin-top:8px;font-size:14px;color:var(--fg2);">Todos os clipes foram unidos em sequência.</p>
    </div>
  </div>

</div>

<script>
// ============================================================
// THEME
// ============================================================
const themeBtn = document.getElementById('themeBtn');
function applyTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  themeBtn.textContent = t==='dark'?'☀️':'🌙';
  try{localStorage.setItem('vcTheme',t);}catch(e){}
}
try{
  const s=localStorage.getItem('vcTheme');
  applyTheme(s||(window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));
}catch(e){applyTheme('light');}
themeBtn.onclick=()=>{
  applyTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');
};

// ============================================================
// STATE
// ============================================================
let clips = []; // [{id, file, name, url, duration, inPoint, outPoint}]
let editingId = null;
let dragging = null; // {id, handle}
let finalBlob = null;

// ============================================================
// UPLOAD
// ============================================================
document.getElementById('fileInput').onchange = e => {
  Array.from(e.target.files).forEach(loadFile);
  e.target.value = '';
};

function loadFile(file){
  const id = Date.now() + Math.random();
  const url = URL.createObjectURL(file);
  const clip = { id, file, name: file.name.replace(/\.[^.]+$/,''), url, duration:0, inPoint:0, outPoint:0 };
  clips.push(clip);
  renderClips();

  // Get duration — robust for mobile
  const tmpVid = document.createElement('video');
  tmpVid.preload = 'metadata';
  tmpVid.muted = true;
  tmpVid.playsInline = true;
  function onMeta(){
    if(tmpVid.duration && isFinite(tmpVid.duration)){
      clip.duration = tmpVid.duration;
      clip.outPoint = tmpVid.duration;
      renderClips();
    }
  }
  tmpVid.onloadedmetadata = onMeta;
  tmpVid.ondurationchange = onMeta;
  // iOS fallback: play briefly to force metadata
  tmpVid.onloadeddata = onMeta;
  tmpVid.src = url;
  tmpVid.load();
}

// ============================================================
// RENDER CLIPS
// ============================================================
function renderClips(){
  const list = document.getElementById('clipsList');
  const empty = document.getElementById('emptyMsg');
  const badge = document.getElementById('clipsCount');

  if(!clips.length){
    empty.classList.remove('hidden');
    badge.classList.add('hidden');
    list.innerHTML='';
    list.appendChild(empty);
    return;
  }
  empty.classList.add('hidden');
  badge.classList.remove('hidden');
  badge.textContent = clips.length + (clips.length===1?' clipe':' clipes');

  list.innerHTML = clips.map((clip, i) => `
    <div class="clip-card ${editingId===clip.id?'editing':''}" id="clipCard_${clip.id}">
      <div class="clip-header" onclick="toggleEditor('${clip.id}')">
        <div class="clip-num">${i+1}</div>
        <div class="clip-info">
          <div class="clip-name">${clip.name}</div>
          <div class="clip-meta">
            ${clip.duration?`⏱ ${fmt(clip.inPoint)} → ${fmt(clip.outPoint)} (${fmt(clip.outPoint-clip.inPoint)})`:'Carregando...'}
          </div>
        </div>
        <div class="clip-actions">
          <button class="btn-icon" title="Mover para cima" onclick="event.stopPropagation();moveClip('${clip.id}',-1)" ${i===0?'disabled':''}>⬆️</button>
          <button class="btn-icon" title="Mover para baixo" onclick="event.stopPropagation();moveClip('${clip.id}',1)" ${i===clips.length-1?'disabled':''}>⬇️</button>
          <button class="btn-icon danger" title="Remover" onclick="event.stopPropagation();removeClip('${clip.id}')">🗑️</button>
        </div>
      </div>
      ${editingId===clip.id ? renderEditor(clip) : ''}
    </div>
  `).join('');

  // Bind editor events after render
  if(editingId){
    const clip = clips.find(c=>c.id==editingId);
    if(clip) bindEditor(clip);
  }
}

// ============================================================
// CLIP ACTIONS
// ============================================================
function toggleEditor(id){
  editingId = editingId==id ? null : id;
  renderClips();
  if(editingId){
    const clip = clips.find(c=>c.id==id);
    if(clip) setTimeout(()=>syncVideo(clip),50);
  }
}

function moveClip(id, dir){
  const i = clips.findIndex(c=>c.id==id);
  if(i<0) return;
  const ni = i+dir;
  if(ni<0||ni>=clips.length) return;
  [clips[i],clips[ni]]=[clips[ni],clips[i]];
  renderClips();
}

function removeClip(id){
  clips = clips.filter(c=>c.id!=id);
  if(editingId==id) editingId=null;
  renderClips();
}

// ============================================================
// EDITOR RENDER (inline HTML string)
// ============================================================
function renderEditor(clip){
  return `
  <div class="clip-editor">
    <div class="video-wrap"><video id="vid_${clip.id}" playsinline src="${clip.url}"></video></div>
    <div class="play-row">
      <button class="btn btn-secondary" onclick="goStart('${clip.id}')">⏮ Início</button>
      <button class="btn btn-primary" id="btnPlay_${clip.id}" onclick="togglePlay('${clip.id}')">▶ Play</button>
      <button class="btn btn-secondary" onclick="goEnd('${clip.id}')">⏭ Fim</button>
    </div>
    <div class="timeline-wrap">
      <div class="tl-hint">🟢 Verde = início do corte &nbsp; 🔴 Vermelho = fim do corte</div>
      <div class="tl-bar" id="tlBar_${clip.id}">
        <div class="tl-selected" id="tlSel_${clip.id}"></div>
        <div class="tl-playhead" id="tlHead_${clip.id}"></div>
        <div class="tl-handle tl-in" id="tlIn_${clip.id}">I</div>
        <div class="tl-handle tl-out" id="tlOut_${clip.id}">F</div>
      </div>
    </div>
    <div class="time-row">
      <div class="time-box">
        <div class="time-box-lbl">🟢 Início</div>
        <div class="time-box-val" id="inTime_${clip.id}">${fmt(clip.inPoint)}</div>
      </div>
      <div class="time-box">
        <div class="time-box-lbl">🔴 Fim</div>
        <div class="time-box-val" id="outTime_${clip.id}">${fmt(clip.outPoint)}</div>
      </div>
    </div>
    <div class="mark-row">
      <button class="btn btn-green" onclick="markIn('${clip.id}')">🟢 Marcar INÍCIO aqui</button>
      <button class="btn btn-red" onclick="markOut('${clip.id}')">🔴 Marcar FIM aqui</button>
    </div>
    <div class="alert alert-info" id="tlHint_${clip.id}">
      <span class="alert-icon">ℹ️</span>
      <span>Arraste as alças ou pressione os botões enquanto o vídeo toca.</span>
    </div>
  </div>`;
}

function bindEditor(clip){
  const bar = document.getElementById(`tlBar_${clip.id}`);
  const handleIn = document.getElementById(`tlIn_${clip.id}`);
  const handleOut = document.getElementById(`tlOut_${clip.id}`);
  const vid = document.getElementById(`vid_${clip.id}`);
  if(!bar||!vid) return;

  updateTL(clip);

  vid.ontimeupdate = () => {
    if(!clip.duration) return;
    const p = vid.currentTime/clip.duration;
    const ph = document.getElementById(`tlHead_${clip.id}`);
    if(ph) ph.style.left=(p*100)+'%';
  };
  vid.onpause=()=>{ const b=document.getElementById(`btnPlay_${clip.id}`); if(b) b.textContent='▶ Play'; };
  vid.onplay=()=>{ const b=document.getElementById(`btnPlay_${clip.id}`); if(b) b.textContent='⏸ Pausar'; };

  // Bar click to seek
  bar.addEventListener('click', e=>{
    if(dragging) return;
    const p=getPct(bar,e.clientX);
    vid.currentTime=p*clip.duration;
  });

  function startDrag(handle, e){
    e.preventDefault();
    e.stopPropagation();
    dragging={id:clip.id, handle};
  }
  handleIn.addEventListener('mousedown', e=>startDrag('in',e));
  handleOut.addEventListener('mousedown', e=>startDrag('out',e));
  handleIn.addEventListener('touchstart', e=>startDrag('in',e), {passive:false});
  handleOut.addEventListener('touchstart', e=>startDrag('out',e), {passive:false});
}

function syncVideo(clip){
  const vid = document.getElementById(`vid_${clip.id}`);
  if(!vid) return;
  if(clip.duration > 0){ updateTL(clip); return; }
  function tryGet(){
    if(vid.duration && isFinite(vid.duration)){
      clip.duration=vid.duration; clip.outPoint=vid.duration;
      updateTL(clip); renderClips();
    }
  }
  vid.onloadedmetadata = tryGet;
  vid.ondurationchange = tryGet;
  vid.onloadeddata = tryGet;
  if(vid.readyState >= 1) tryGet();
}

// ============================================================
// PLAYBACK
// ============================================================
function togglePlay(id){
  const vid=document.getElementById(`vid_${id}`);
  if(!vid) return;
  vid.paused?vid.play():vid.pause();
}
function goStart(id){
  const clip=clips.find(c=>c.id==id);
  const vid=document.getElementById(`vid_${id}`);
  if(vid&&clip) vid.currentTime=clip.inPoint;
}
function goEnd(id){
  const clip=clips.find(c=>c.id==id);
  const vid=document.getElementById(`vid_${id}`);
  if(vid&&clip) vid.currentTime=Math.max(0,clip.outPoint-1);
}

// ============================================================
// MARK IN / OUT
// ============================================================
function markIn(id){
  const clip=clips.find(c=>c.id==id);
  const vid=document.getElementById(`vid_${id}`);
  if(!clip||!vid) return;
  clip.inPoint=vid.currentTime;
  if(clip.inPoint>=clip.outPoint) clip.outPoint=Math.min(clip.duration,clip.inPoint+1);
  updateTL(clip);
}
function markOut(id){
  const clip=clips.find(c=>c.id==id);
  const vid=document.getElementById(`vid_${id}`);
  if(!clip||!vid) return;
  clip.outPoint=vid.currentTime;
  if(clip.outPoint<=clip.inPoint) clip.inPoint=Math.max(0,clip.outPoint-1);
  updateTL(clip);
}

// ============================================================
// DRAG (global)
// ============================================================
document.addEventListener('mousemove', e=>onDragMove(e.clientX));
document.addEventListener('touchmove', e=>{
  if(dragging){ e.preventDefault(); onDragMove(e.touches[0].clientX); }
},{passive:false});
document.addEventListener('mouseup',()=>{dragging=null;});
document.addEventListener('touchend',()=>{dragging=null;});

function onDragMove(clientX){
  if(!dragging) return;
  const clip=clips.find(c=>c.id==dragging.id);
  const bar=document.getElementById(`tlBar_${dragging.id}`);
  if(!clip||!bar) return;
  const p=getPct(bar,clientX);
  const t=p*clip.duration;
  if(dragging.handle==='in'){
    clip.inPoint=Math.max(0,Math.min(t,clip.outPoint-0.3));
  } else {
    clip.outPoint=Math.min(clip.duration,Math.max(t,clip.inPoint+0.3));
  }
  updateTL(clip);
}

function getPct(bar,clientX){
  const r=bar.getBoundingClientRect();
  return Math.max(0,Math.min(1,(clientX-r.left)/r.width));
}

// ============================================================
// UPDATE TIMELINE UI
// ============================================================
function updateTL(clip){
  if(!clip.duration) return;
  const inPct=(clip.inPoint/clip.duration)*100;
  const outPct=(clip.outPoint/clip.duration)*100;
  const hi=document.getElementById(`tlIn_${clip.id}`);
  const ho=document.getElementById(`tlOut_${clip.id}`);
  const sel=document.getElementById(`tlSel_${clip.id}`);
  const ti=document.getElementById(`inTime_${clip.id}`);
  const to=document.getElementById(`outTime_${clip.id}`);
  const hint=document.getElementById(`tlHint_${clip.id}`);
  if(hi) hi.style.left=inPct+'%';
  if(ho) ho.style.left=outPct+'%';
  if(sel){ sel.style.left=inPct+'%'; sel.style.width=(outPct-inPct)+'%'; }
  if(ti) ti.textContent=fmt(clip.inPoint);
  if(to) to.textContent=fmt(clip.outPoint);
  if(hint){
    const dur=clip.outPoint-clip.inPoint;
    hint.className='alert alert-success';
    hint.innerHTML=`<span class="alert-icon">✅</span><span>Trecho: <strong>${fmt(clip.inPoint)}</strong> → <strong>${fmt(clip.outPoint)}</strong> — <strong>${fmt(dur)}</strong></span>`;
  }
  // Update meta in header
  const meta=document.querySelector(`#clipCard_${clip.id} .clip-meta`);
  if(meta) meta.textContent=`⏱ ${fmt(clip.inPoint)} → ${fmt(clip.outPoint)} (${fmt(clip.outPoint-clip.inPoint)})`;
}

// ============================================================
// FORMAT TIME
// ============================================================
function fmt(s){
  if(isNaN(s)||s==null) return '0:00';
  const m=Math.floor(s/60), sec=Math.floor(s%60);
  return `${m}:${sec.toString().padStart(2,'0')}`;
}

// ============================================================
// EXPORT ALL CLIPS IN SEQUENCE
// ============================================================
document.getElementById('btnExport').onclick = () => exportAll();

async function exportAll(){
  if(!clips.length){ showExportAlert('error','❌ Adicione pelo menos um vídeo.'); return; }
  const invalid=clips.filter(c=>!c.duration||(c.outPoint-c.inPoint)<0.3);
  if(invalid.length){ showExportAlert('error','❌ Algum clipe ainda está carregando ou sem corte definido.'); return; }

  document.getElementById('btnExport').disabled=true;
  document.getElementById('downloadSection').classList.add('hidden');
  document.getElementById('exportProgress').classList.remove('hidden');
  showExportAlert('','');

  try{
    const blobs=[];
    for(let i=0;i<clips.length;i++){
      const clip=clips[i];
      setExportProgress((i/clips.length)*90, `Processando clipe ${i+1} de ${clips.length}: ${clip.name}...`);
      const b=await trimVideo(clip.file, clip.inPoint, clip.outPoint, (p)=>{
        setExportProgress(((i+p)/clips.length)*90, `Clipe ${i+1}/${clips.length}: ${Math.round(p*100)}%`);
      });
      blobs.push(b);
    }

    setExportProgress(95,'Unindo clipes...');
    const finalBlob2 = blobs.length===1 ? blobs[0] : new Blob(blobs, {type: blobs[0].type});
    finalBlob = finalBlob2;

    setExportProgress(100,'✅ Concluído!');

    // Download
    const url=URL.createObjectURL(finalBlob);
    const name='video-editado.webm';
    const btn=document.getElementById('btnDownload');
    btn.onclick=()=>{
      const a=document.createElement('a');
      a.href=url; a.download=name; a.click();
    };
    document.getElementById('downloadSection').classList.remove('hidden');
    showExportAlert('success','✅ Exportação concluída! Clique no botão verde para baixar.');

    // Notify n8n (silently)
    fetch('https://rarelookingorca-n8n.cloudfy.live/webhook/vectcut-salvar',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        clips_count:clips.length,
        clips:clips.map(c=>({name:c.name,in:c.inPoint,out:c.outPoint})),
        created_at:new Date().toISOString()
      })
    }).catch(()=>{});

  } catch(err){
    showExportAlert('error','❌ Erro: '+err.message);
  }
  document.getElementById('btnExport').disabled=false;
}

// ============================================================
// TRIM VIDEO (MediaRecorder)
// ============================================================
function trimVideo(file, start, end, onProgress){
  return new Promise((resolve,reject)=>{
    const vid=document.createElement('video');
    vid.src=URL.createObjectURL(file);
    vid.muted=false; vid.preload='auto';
    vid.onloadedmetadata=()=>{
      const canvas=document.createElement('canvas');
      canvas.width=vid.videoWidth||1280; canvas.height=vid.videoHeight||720;
      const ctx=canvas.getContext('2d');
      const stream=canvas.captureStream(30);
      try{
        const ac=new(window.AudioContext||window.webkitAudioContext)();
        const src=ac.createMediaElementSource(vid);
        const dest=ac.createMediaStreamDestination();
        src.connect(dest); src.connect(ac.destination);
        dest.stream.getAudioTracks().forEach(t=>stream.addTrack(t));
      }catch(e){}
      const chunks=[];
      const mime=MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus')?'video/webm;codecs=vp9,opus':
        MediaRecorder.isTypeSupported('video/webm;codecs=vp8,opus')?'video/webm;codecs=vp8,opus':'video/webm';
      const mr=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:4_000_000});
      mr.ondataavailable=e=>{if(e.data.size>0) chunks.push(e.data);};
      mr.onstop=()=>resolve(new Blob(chunks,{type:mime}));
      vid.currentTime=start;
      vid.onseeked=()=>{
        vid.play(); mr.start(100);
        const di=setInterval(()=>{ ctx.drawImage(vid,0,0,canvas.width,canvas.height); },1000/30);
        const pe=setInterval(()=>{
          const p=(vid.currentTime-start)/(end-start);
          if(onProgress) onProgress(Math.min(1,p));
          if(vid.currentTime>=end-0.05){
            clearInterval(di); clearInterval(pe);
            vid.pause(); mr.stop();
          }
        },50);
        setTimeout(()=>{
          if(mr.state!=='inactive'){clearInterval(di);vid.pause();mr.stop();}
        },(end-start)*1000+4000);
      };
    };
    vid.onerror=()=>reject(new Error('Erro ao carregar vídeo'));
  });
}

function setExportProgress(pct,label){
  document.getElementById('exportFill').style.width=pct+'%';
  document.getElementById('exportLabel').textContent=label;
}
function showExportAlert(type,msg){
  const el=document.getElementById('exportAlert');
  if(!type||!msg){el.className='hidden';return;}
  const map={success:'alert-success',error:'alert-error',info:'alert-info'};
  el.className='alert '+(map[type]||'alert-info');
  el.innerHTML=`<span class="alert-icon">${type==='success'?'✅':'❌'}</span><span>${msg}</span>`;
}

function saveHistory(item){
  try{
    const l=JSON.parse(localStorage.getItem('vcHistory')||'[]');
    l.unshift(item); if(l.length>30) l.pop();
    localStorage.setItem('vcHistory',JSON.stringify(l));
  }catch(e){}
}
