<title>Editor de Vídeo</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&display=swap" rel="stylesheet">

<!-- Habilita SharedArrayBuffer em qualquer host HTTPS (necessário para FFmpeg.wasm) -->
<script src="https://unpkg.com/coi-serviceworker@0.1.9/coi-serviceworker.min.js"></script>
<!-- FFmpeg.wasm v0.10 – API estável, sem dependências extras -->
<script src="https://unpkg.com/@ffmpeg/ffmpeg@0.10.1/dist/ffmpeg.min.js"></script>

<style>
:root{
  --bg:#f0eef8;--card:#fff;--border:#ddd8f0;--fg:#1a1830;--fg2:#666;
  --a:#5b3fe4;--a2:#ede9fd;--g:#16a34a;--r:#dc2626;
  --sh:0 2px 10px rgba(0,0,0,.08);
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111;--card:#1e1b2e;--border:#333;--fg:#f0eef8;--fg2:#aaa;--a2:#2a2060;color-scheme:dark;
}}
:root[data-theme="dark"]{--bg:#111;--card:#1e1b2e;--border:#333;--fg:#f0eef8;--fg2:#aaa;--a2:#2a2060;color-scheme:dark;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--fg);font-size:18px;
  padding:0 max(16px,env(safe-area-inset-left,0px)) 80px;min-height:100vh;}
h1{font-size:22px;font-weight:800;color:var(--a);display:flex;align-items:center;gap:8px;padding:16px 0 12px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:var(--sh);}
.drop{border:3px dashed var(--a);border-radius:12px;background:var(--a2);padding:28px 12px;text-align:center;cursor:pointer;position:relative;}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:100px;}
.drop-icon{font-size:44px;}.drop-txt{font-size:20px;font-weight:800;color:var(--a);margin-top:6px;}
.drop-sub{font-size:14px;color:var(--fg2);margin-top:4px;}
.clip{background:var(--bg);border:2px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden;}
.clip.open{border-color:var(--a);}
.clip-head{display:flex;align-items:center;gap:10px;padding:13px;cursor:pointer;user-select:none;}
.num{background:var(--a);color:#fff;font-weight:800;font-size:14px;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.clip-info{flex:1;min-width:0;}
.clip-name{font-weight:800;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.clip-time{font-size:13px;color:var(--fg2);margin-top:2px;}
.clip-btns{display:flex;gap:6px;flex-shrink:0;}
.ic{width:38px;height:38px;border-radius:9px;border:1px solid var(--border);background:var(--card);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;}
.ic:disabled{opacity:.3;cursor:not-allowed;}
.editor{padding:0 13px 13px;}
video{width:100%;border-radius:9px;background:#000;display:block;max-height:260px;object-fit:contain;margin-bottom:10px;}
.prow{display:flex;gap:8px;justify-content:center;margin-bottom:10px;flex-wrap:wrap;}
.tl{background:var(--card);border-radius:10px;padding:12px;border:1px solid var(--border);margin-bottom:10px;}
.tl-label{font-size:13px;font-weight:700;color:var(--fg2);margin-bottom:6px;}
.tl-bar{position:relative;height:44px;background:#e5e2f0;border-radius:8px;cursor:pointer;overflow:visible;}
.tl-sel{position:absolute;top:0;bottom:0;background:var(--a);opacity:.35;pointer-events:none;}
.tl-ph{position:absolute;top:-3px;bottom:-3px;width:3px;background:var(--a);border-radius:3px;pointer-events:none;}
.tl-h{position:absolute;top:50%;transform:translateY(-50%);width:22px;height:38px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;font-weight:800;cursor:ew-resize;z-index:3;touch-action:none;margin-left:-11px;box-shadow:0 2px 6px rgba(0,0,0,.3);}
.h-in{background:var(--g);}.h-out{background:var(--r);}
.times{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.tbox{background:var(--bg);border:2px solid var(--border);border-radius:9px;padding:9px 12px;}
.tbox-l{font-size:11px;font-weight:800;color:var(--fg2);text-transform:uppercase;letter-spacing:.04em;}
.tbox-v{font-size:22px;font-weight:800;color:var(--a);}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:11px;font-family:'Nunito',sans-serif;font-weight:800;cursor:pointer;transition:opacity .12s;white-space:nowrap;padding:12px 16px;min-height:50px;font-size:16px;}
.btn:active{opacity:.75;}.btn:disabled{opacity:.4;cursor:not-allowed;}
.b-pri{background:var(--a);color:#fff;}.b-sec{background:var(--bg);color:var(--fg);border:2px solid var(--border);}
.b-g{background:var(--g);color:#fff;}.b-full{width:100%;}.b-xl{font-size:19px;min-height:62px;}
.info{border-radius:9px;padding:10px 13px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.i-ok{background:#dcfce7;color:var(--g);}.i-err{background:#fee2e2;color:var(--r);}.i-inf{background:var(--a2);color:var(--a);}
.prog{margin:10px 0;}.prog-l{font-size:14px;font-weight:800;color:var(--fg2);text-align:center;margin-bottom:6px;}
.prog-bg{height:16px;background:#e5e2f0;border-radius:20px;overflow:hidden;}
.prog-f{height:100%;background:var(--a);border-radius:20px;transition:width .3s;}
.dl-btn{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--g);color:#fff;border-radius:12px;font-size:20px;font-weight:800;padding:18px;min-height:62px;cursor:pointer;border:none;font-family:'Nunito',sans-serif;width:100%;}
.empty{text-align:center;padding:28px;color:var(--fg2);}.empty-i{font-size:42px;margin-bottom:8px;}
.hidden{display:none!important;}
</style>

<h1>✂️ Editor de Vídeo</h1>

<div class="card">
  <div style="font-size:17px;font-weight:800;margin-bottom:12px;">
    🎬 Sequência
    <span id="badge" class="hidden" style="background:var(--a2);color:var(--a);font-size:13px;padding:2px 10px;border-radius:20px;margin-left:6px;"></span>
  </div>
  <div id="clipsList">
    <div class="empty"><div class="empty-i">🎞️</div>Nenhum vídeo ainda.<br>Adicione abaixo!</div>
  </div>
</div>

<div class="card">
  <div style="font-size:17px;font-weight:800;margin-bottom:12px;">➕ Adicionar Vídeo</div>
  <div class="drop">
    <input type="file" accept="video/*" id="fi" multiple>
    <div class="drop-icon">📂</div>
    <div class="drop-txt">Toque para escolher</div>
    <div class="drop-sub">Pode selecionar vários de uma vez</div>
  </div>
</div>

<div class="card">
  <div style="font-size:17px;font-weight:800;margin-bottom:12px;">⬇️ Exportar</div>
  <div id="expAlert" class="hidden"></div>
  <div id="expProg" class="hidden">
    <div class="prog">
      <div class="prog-l" id="progLbl">Aguarde...</div>
      <div class="prog-bg"><div class="prog-f" id="progF" style="width:0%"></div></div>
    </div>
  </div>
  <button class="btn b-pri b-full b-xl" id="btnExp">✂️ Cortar e Juntar → Baixar</button>
  <div id="dlSection" class="hidden" style="margin-top:12px;">
    <button class="dl-btn" id="btnDl">⬇️ Baixar Vídeo Final (.mp4)</button>
  </div>
</div>

<script>
// ── STATE ──────────────────────────────────────────────────
var clips=[], openId=null, drag=null;
var ff=null, ffReady=false;

// ── UPLOAD ─────────────────────────────────────────────────
document.getElementById('fi').onchange=function(e){
  Array.from(e.target.files).forEach(addClip);
  e.target.value='';
};
function addClip(file){
  var id='_'+Date.now()+Math.random().toString(36).slice(2);
  clips.push({id:id,file:file,url:URL.createObjectURL(file),
    name:file.name.replace(/\.[^.]+$/,''),dur:0,in:0,out:0});
  openId=id;render();
}

// ── RENDER ─────────────────────────────────────────────────
function render(){
  var list=document.getElementById('clipsList');
  var badge=document.getElementById('badge');
  if(!clips.length){
    list.innerHTML='<div class="empty"><div class="empty-i">🎞️</div>Nenhum vídeo ainda.<br>Adicione abaixo!</div>';
    badge.classList.add('hidden');return;
  }
  badge.classList.remove('hidden');
  badge.textContent=clips.length+(clips.length===1?' clipe':' clipes');
  list.innerHTML=clips.map(function(c,i){
    return '<div class="clip'+(openId===c.id?' open':'')+'" id="card_'+c.id+'">'
      +'<div class="clip-head" onclick="toggle(\''+c.id+'\')">'
      +'<div class="num">'+(i+1)+'</div>'
      +'<div class="clip-info">'
        +'<div class="clip-name">'+esc(c.name)+'</div>'
        +'<div class="clip-time" id="ct_'+c.id+'">'
          +(c.dur>0?'⏱ '+ft(c.in)+' → '+ft(c.out)+' ('+ft(c.out-c.in)+')':'▶ Toque para editar')
        +'</div>'
      +'</div>'
      +'<div class="clip-btns">'
        +'<button class="ic" onclick="event.stopPropagation();mv(\''+c.id+'\',-1)" '+(i===0?'disabled':'')+'>⬆️</button>'
        +'<button class="ic" onclick="event.stopPropagation();mv(\''+c.id+'\',1)" '+(i===clips.length-1?'disabled':'')+'>⬇️</button>'
        +'<button class="ic" onclick="event.stopPropagation();rm(\''+c.id+'\')">🗑️</button>'
      +'</div>'
      +'</div>'
      +(openId===c.id?edHtml(c):'')
      +'</div>';
  }).join('');
  if(openId){var c=clips.find(function(x){return x.id===openId;});if(c)bindEd(c);}
}

function edHtml(c){
  return '<div class="editor">'
    +'<video id="v_'+c.id+'" src="'+c.url+'" playsinline preload="auto" controls></video>'
    +'<div class="prow">'
      +'<button class="btn b-sec" onclick="seekTo(\''+c.id+'\',\'in\')">⏮ Ir p/ Início</button>'
      +'<button class="btn b-sec" onclick="seekTo(\''+c.id+'\',\'out\')">⏭ Ir p/ Fim</button>'
    +'</div>'
    +'<div class="tl">'
      +'<div class="tl-label">🟢 Início &nbsp;&nbsp;🔴 Fim — arraste as alças ou use os botões</div>'
      +'<div class="tl-bar" id="bar_'+c.id+'">'
        +'<div class="tl-sel" id="sel_'+c.id+'"></div>'
        +'<div class="tl-ph" id="ph_'+c.id+'" style="left:0%"></div>'
        +'<div class="tl-h h-in" id="hin_'+c.id+'" style="left:0%">I</div>'
        +'<div class="tl-h h-out" id="hout_'+c.id+'" style="left:100%">F</div>'
      +'</div>'
    +'</div>'
    +'<div class="times">'
      +'<div class="tbox"><div class="tbox-l">🟢 Início</div><div class="tbox-v" id="ti_'+c.id+'">'+ft(c.in)+'</div></div>'
      +'<div class="tbox"><div class="tbox-l">🔴 Fim</div><div class="tbox-v" id="to_'+c.id+'">'+ft(c.out)+'</div></div>'
    +'</div>'
    +'<div class="mrow">'
      +'<button class="btn b-g" onclick="markIn(\''+c.id+'\')">🟢 Marcar INÍCIO</button>'
      +'<button class="btn b-r" onclick="markOut(\''+c.id+'\')">🔴 Marcar FIM</button>'
    +'</div>'
    +'<div id="hint_'+c.id+'" class="info i-inf"><span>ℹ️</span><span>Dê play, posicione e clique INÍCIO / FIM para marcar o trecho.</span></div>'
    +'</div>';
}

function bindEd(c){
  var vid=document.getElementById('v_'+c.id);
  if(!vid)return;
  function tryDur(){
    if(vid.duration&&isFinite(vid.duration)&&vid.duration>0&&c.dur===0){
      c.dur=vid.duration;c.out=vid.duration;updTL(c);
    }
  }
  vid.addEventListener('loadedmetadata',tryDur);
  vid.addEventListener('durationchange',tryDur);
  vid.addEventListener('loadeddata',tryDur);
  if(vid.readyState>=1)tryDur();
  vid.addEventListener('timeupdate',function(){
    if(!c.dur)return;
    var ph=document.getElementById('ph_'+c.id);
    if(ph)ph.style.left=(vid.currentTime/c.dur*100)+'%';
  });
  var bar=document.getElementById('bar_'+c.id);
  if(bar){
    bar.addEventListener('click',function(e){
      if(drag)return;if(!c.dur)return;
      vid.currentTime=pct(bar,e.clientX)*c.dur;
    });
    ['in','out'].forEach(function(h){
      var el=document.getElementById((h==='in'?'hin_':'hout_')+c.id);
      if(!el)return;
      function sd(e){e.preventDefault();e.stopPropagation();drag={id:c.id,h:h};}
      el.addEventListener('mousedown',sd);
      el.addEventListener('touchstart',sd,{passive:false});
    });
  }
  updTL(c);
}

function toggle(id){openId=openId===id?null:id;render();}
function mv(id,d){
  var i=clips.findIndex(function(c){return c.id===id;});
  if(i<0)return;var n=i+d;if(n<0||n>=clips.length)return;
  var t=clips[i];clips[i]=clips[n];clips[n]=t;render();
}
function rm(id){clips=clips.filter(function(c){return c.id!==id;});if(openId===id)openId=null;render();}
function seekTo(id,pt){
  var c=clips.find(function(x){return x.id===id;});
  var v=document.getElementById('v_'+id);
  if(!c||!v)return;
  v.currentTime=pt==='in'?c.in:Math.max(0,c.out-0.5);
}
function markIn(id){
  var c=clips.find(function(x){return x.id===id;});
  var v=document.getElementById('v_'+id);if(!c||!v)return;
  c.in=v.currentTime;if(c.in>=c.out)c.out=Math.min(c.dur,c.in+1);
  updTL(c);
}
function markOut(id){
  var c=clips.find(function(x){return x.id===id;});
  var v=document.getElementById('v_'+id);if(!c||!v)return;
  c.out=v.currentTime;if(c.out<=c.in)c.in=Math.max(0,c.out-1);
  updTL(c);
}

document.addEventListener('mousemove',function(e){doDrag(e.clientX);});
document.addEventListener('touchmove',function(e){if(drag){e.preventDefault();doDrag(e.touches[0].clientX);}},{passive:false});
document.addEventListener('mouseup',function(){drag=null;});
document.addEventListener('touchend',function(){drag=null;});
function doDrag(cx){
  if(!drag)return;
  var c=clips.find(function(x){return x.id===drag.id;});
  var bar=document.getElementById('bar_'+drag.id);
  if(!c||!bar||!c.dur)return;
  var t=pct(bar,cx)*c.dur;
  if(drag.h==='in')c.in=Math.max(0,Math.min(t,c.out-0.3));
  else c.out=Math.min(c.dur,Math.max(t,c.in+0.3));
  updTL(c);
}
function pct(bar,cx){
  var r=bar.getBoundingClientRect();
  return Math.max(0,Math.min(1,(cx-r.left)/r.width));
}
function updTL(c){
  if(!c.dur)return;
  var ip=(c.in/c.dur)*100,op=(c.out/c.dur)*100;
  function s(id,prop,val){var el=document.getElementById(id+c.id);if(el)el[prop]=val;}
  s('hin_','style.left',ip+'%');s('hout_','style.left',op+'%');
  var sel=document.getElementById('sel_'+c.id);
  if(sel){sel.style.left=ip+'%';sel.style.width=(op-ip)+'%';}
  s('ti_','textContent',ft(c.in));s('to_','textContent',ft(c.out));
  var dur=c.out-c.in;
  var hint=document.getElementById('hint_'+c.id);
  if(hint&&dur>0.3){hint.className='info i-ok';hint.innerHTML='<span>✅</span><span>Trecho: <b>'+ft(c.in)+'</b> → <b>'+ft(c.out)+'</b> &nbsp;('+ft(dur)+')</span>';}
  var ct=document.getElementById('ct_'+c.id);
  if(ct)ct.textContent='⏱ '+ft(c.in)+' → '+ft(c.out)+' ('+ft(dur)+')';
}
function ft(s){if(!s||isNaN(s)||s<0)return '0:00';return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');}
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML;}

// ── FFMPEG ─────────────────────────────────────────────────
document.getElementById('btnExp').onclick=exportAll;

async function initFFmpeg(){
  if(ffReady)return;
  setP(5,'Carregando FFmpeg (apenas na primeira vez)...');
  var {createFFmpeg,fetchFile}=FFmpeg;
  ff=createFFmpeg({
    log:true,
    corePath:'https://unpkg.com/@ffmpeg/core@0.10.0/dist/ffmpeg-core.js',
    progress:function(p){
      if(p.ratio>=0)setP(30+p.ratio*55,'Processando: '+Math.round(p.ratio*100)+'%');
    }
  });
  await ff.load();
  ffReady=true;
  window._ffetchFile=fetchFile; // salva referência
}

async function exportAll(){
  if(!clips.length){showExp('err','❌ Adicione pelo menos um vídeo.');return;}
  var bad=clips.filter(function(c){return c.dur<=0||(c.out-c.in)<0.3;});
  if(bad.length){showExp('err','❌ Abra cada clipe e marque o início e fim antes de exportar.');return;}

  document.getElementById('btnExp').disabled=true;
  document.getElementById('dlSection').classList.add('hidden');
  document.getElementById('expProg').classList.remove('hidden');
  showExp('','');

  try{
    await initFFmpeg();
    var fetchFile=window._ffetchFile;

    // 1. Escreve cada arquivo no sistema de arquivos virtual do FFmpeg
    setP(15,'Carregando arquivos...');
    for(var i=0;i<clips.length;i++){
      var c=clips[i];
      var ext=c.file.name.split('.').pop().toLowerCase()||'mp4';
      var inName='raw'+i+'.'+ext;
      setP(15+i/clips.length*10,'Carregando: '+c.name+'...');
      ff.FS('writeFile',inName,await fetchFile(c.file));
      c._raw=inName;
    }

    // 2. Corta cada clipe → clip0.mp4, clip1.mp4 ...
    for(var i=0;i<clips.length;i++){
      var c=clips[i];
      var out='clip'+i+'.mp4';
      setP(25+i/clips.length*50,'Cortando clipe '+(i+1)+'/'+clips.length+': '+c.name+'...');
      await ff.run(
        '-ss',c.in.toFixed(3),
        '-to',c.out.toFixed(3),
        '-i',c._raw,
        '-c:v','libx264','-preset','ultrafast','-crf','23',
        '-c:a','aac','-b:a','128k',
        '-avoid_negative_ts','make_zero',
        '-y',out
      );
      c._cut=out;
    }

    // 3. Se só tem 1 clipe, não precisa concat
    var finalFile;
    if(clips.length===1){
      finalFile=clips[0]._cut;
    } else {
      setP(80,'Juntando todos os clipes...');
      // Cria lista para concat demuxer
      var listTxt=clips.map(function(c){return "file '"+c._cut+"'";}).join('\n');
      ff.FS('writeFile','list.txt',new TextEncoder().encode(listTxt));
      await ff.run(
        '-f','concat','-safe','0',
        '-i','list.txt',
        '-c','copy',
        '-movflags','+faststart',
        '-y','output.mp4'
      );
      finalFile='output.mp4';
    }

    // 4. Lê resultado
    setP(95,'Preparando download...');
    var data=ff.FS('readFile',finalFile);
    var blob=new Blob([data.buffer],{type:'video/mp4'});
    var url=URL.createObjectURL(blob);

    document.getElementById('btnDl').onclick=function(){
      var a=document.createElement('a');a.href=url;a.download='video-editado.mp4';
      document.body.appendChild(a);a.click();document.body.removeChild(a);
    };
    document.getElementById('dlSection').classList.remove('hidden');
    setP(100,'✅ Pronto!');
    showExp('ok','✅ Vídeo pronto! Clique no botão verde para baixar.');

    // Limpa FS
    clips.forEach(function(c){
      try{ff.FS('unlink',c._raw);}catch(_){}
      try{ff.FS('unlink',c._cut);}catch(_){}
    });
    try{ff.FS('unlink','list.txt');}catch(_){}
    try{ff.FS('unlink','output.mp4');}catch(_){}

  }catch(err){
    console.error('[export error]',err);
    showExp('err','❌ Erro: '+err.message+'. Abra o Console para mais detalhes.');
    setP(0,'');
  }
  document.getElementById('btnExp').disabled=false;
}

function setP(pct,lbl){
  document.getElementById('progF').style.width=Math.max(0,Math.min(100,pct))+'%';
  if(lbl!==undefined)document.getElementById('progLbl').textContent=lbl;
}
function showExp(type,msg){
  var el=document.getElementById('expAlert');
  if(!type){el.className='hidden';return;}
  el.className='info '+(type==='ok'?'i-ok':'i-err');
  el.innerHTML='<span>'+(type==='ok'?'✅':'❌')+'</span><span>'+msg+'</span>';
}
</script>
